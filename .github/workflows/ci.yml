name: CI

on:
  push:
  pull_request:
    branches: [main]
  schedule:
    - cron: "7 3 * * 1"  # Monday 03:07 UTC — catch upstream prerelease drift

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version:
          - "3.10"
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - uses: actions/checkout@57eae2f15af6d40caa38f4fb310f4e95ac4ca55f  # v7.0.1
      - uses: actions/setup-python@1203e1e43f7ce84b6e5dd75cf49ca642aad23be8  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run ruff check src/ tests/
      - run: uv run pytest tests/ -q --evals --tb=short
      - run: uv build

  test-prerelease-python:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@57eae2f15af6d40caa38f4fb310f4e95ac4ca55f  # v7.0.1
      - uses: actions/setup-python@1203e1e43f7ce84b6e5dd75cf49ca642aad23be8  # v7.0.0
        with:
          python-version: "3.15"
          allow-prereleases: true
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv run pytest tests/ -q --evals --tb=short
      - run: uv build

  test-prerelease-pytest:
    if: github.ref == 'refs/heads/main' || github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@57eae2f15af6d40caa38f4fb310f4e95ac4ca55f  # v7.0.1
      - uses: actions/setup-python@1203e1e43f7ce84b6e5dd75cf49ca642aad23be8  # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      - run: uv sync --dev
      - run: uv pip install --pre pytest
      - run: uv run pytest tests/ -q --evals --tb=short
      - run: uv build

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [test, test-prerelease-python, test-prerelease-pytest]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - uses: actions/checkout@57eae2f15af6d40caa38f4fb310f4e95ac4ca55f  # v7.0.1
      - uses: actions/setup-python@1203e1e43f7ce84b6e5dd75cf49ca642aad23be8  # v7.0.0
        with:
          python-version: "3.14"
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d  # v10.0.1
        with:
          enable-cache: true
      - run: uv build
      - run: uv tool install twine
      - run: uv tool run twine upload dist/* -u __token__ -p ${{ secrets.PYPI_TOKEN }}