[project]
name = "pytest-evals"
version = "0.1.0"
description = "Eval-Driven Development plugin for pytest — pass@k, tiers, LLM-as-judge"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Darren Meehan" }]

dependencies = [
    "pytest>=8.0",
]

[tool.ruff.lint]
ignore = ["PLW1510"]

[tool.pytest.ini_options]
python_files = ["eval_*.py", "test_*.py", "*_test.py"]
python_functions = ["eval_*", "test_*", "*_test"]

[project.optional-dependencies]
llm = [
    "litellm>=1.60,<2",
]
dev = [
    "ruff>=0.17.1,<1",
]

[project.entry-points.pytest11]
evals = "pytest_evals.plugin"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"